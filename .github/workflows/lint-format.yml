---
name: Lint & Format Check

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  super-linter:
    name: Super-Linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Super-Linter
        uses: github/super-linter@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: main
          LINTER_RULES_PATH: .github/linters
          VALIDATE_ALL_CODEBASE: true
          # Exclude large asset folders, generated site, and Liquid templates (not valid standalone HTML)
          FILTER_REGEX_EXCLUDE: '(^Assets/|^_site/|^\.git/|^_includes/|^_layouts/)'
          # Super-linter v7 disables per-linter via VALIDATE_<NAME>: false (a single DISABLE var does not exist)
          VALIDATE_JSCPD: false
          VALIDATE_NATURAL_LANGUAGE: false
          VALIDATE_JAVASCRIPT_STANDARD: false
          VALIDATE_GITHUB_ACTIONS: false
          # Optionally run in quiet mode
          ACTIONS_ALLOW_UNSECURE_COMMANDS: false

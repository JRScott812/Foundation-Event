---
name: Link Check

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0'

jobs:
  linkCheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Build site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build

      - name: Check markdown links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: yes
          use-verbose-mode: yes
          config-file: '.github/markdown-link-check-config.json'
          # Avoid recursing into vendor/bundle gem READMEs installed by bundler-cache
          max-depth: 1

      - name: Validate built HTML links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --root-dir _site --verbose --no-progress '**/*.html'
          fail: true
